<!DOCTYPE html>
<html>
<head>
  <title>Economic Calendar</title>

  <style>
    body {
      margin:0;
      font-family:Arial;
      background:#030604;
      color:#62ff9e;
    }

    .nav {
      padding:20px;
      border-bottom:1px solid rgba(98,255,158,0.2);
      text-align:center;
    }

    .nav a {
      margin:0 15px;
      text-decoration:none;
      color:#62ff9e;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin-top:30px;
    }

    .container {
      max-width:1200px;
      margin:30px auto;
      padding:20px;
    }

    .card {
      border:1px solid rgba(98,255,158,0.3);
      padding:20px;
      margin-bottom:25px;
      background:#030604;
    }

    p {
      color:rgba(98,255,158,0.75);
      text-align:center;
    }

    .calendar-wrap {
      height:800px;
      border:1px solid rgba(98,255,158,0.3);
      overflow:hidden;
      background:#000;
    }
  </style>
</head>

<body>

<div class="nav">
  <a href="index.html">HOME</a>
  <a href="journal.html">JOURNAL</a>
  <a href="calendar.html">ECONOMIC CALENDAR</a>
</div>

<h1>ECONOMIC CALENDAR</h1>

<div class="container">
  <div class="card">
    <p>Focused on US and European market news. Use the widget filters to select USD and EUR events.</p>

    <div class="calendar-wrap">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>

        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
        {
          "colorTheme": "dark",
          "isTransparent": true,
          "width": "100%",
          "height": "800",
          "locale": "en",
          "importanceFilter": "-1,0,1"
        }
        </script>
      </div>
    </div>
  </div>
</div>

</body>
</html>
