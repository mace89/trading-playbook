<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Diary</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  margin: 0;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

.section {
  margin-bottom: 40px;
}

.upload-box {
  border: 2px dashed #334155;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
  border-radius: 10px;
}

input[type="file"] {
  margin-top: 10px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

textarea {
  width: 100%;
  margin-top: 10px;
  background: #0f172a;
  color: #e2e8f0;
  border: 1px solid #334155;
  border-radius: 5px;
  padding: 8px;
}

button {
  margin-top: 10px;
  padding: 8px 12px;
  border: none;
  background: #22c55e;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button.delete {
  background: #ef4444;
}
</style>
</head>
<body>

<h1>Daily Diary</h1>

<div class="section">
  <h2>EU Session (DAX)</h2>
  <div class="upload-box">
    <input type="file" id="euUpload" accept="image/*">
  </div>
  <div id="euGallery" class="gallery"></div>
</div>

<div class="section">
  <h2>US Session</h2>
  <div class="upload-box">
    <input type="file" id="usUpload" accept="image/*">
  </div>
  <div id="usGallery" class="gallery"></div>
</div>

<script>
function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function loadData(key) {
  return JSON.parse(localStorage.getItem(key)) || [];
}

function createCard(entry, index, type) {
  const card = document.createElement('div');
  card.className = 'card';

  const img = document.createElement('img');
  img.src = entry.image;

  const textarea = document.createElement('textarea');
  textarea.value = entry.notes;
  textarea.placeholder = 'Write notes here...';

  textarea.addEventListener('change', () => {
    const data = loadData(type);
    data[index].notes = textarea.value;
    saveData(type, data);
  });

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete';
  delBtn.className = 'delete';

  delBtn.onclick = () => {
    let data = loadData(type);
    data.splice(index, 1);
    saveData(type, data);
    renderGallery(type);
  };

  card.appendChild(img);
  card.appendChild(textarea);
  card.appendChild(delBtn);

  return card;
}

function renderGallery(type) {
  const gallery = document.getElementById(type + 'Gallery');
  gallery.innerHTML = '';
  const data = loadData(type);

  data.forEach((entry, index) => {
    gallery.appendChild(createCard(entry, index, type));
  });
}

function handleUpload(inputId, type) {
  const input = document.getElementById(inputId);

  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = loadData(type);
      data.push({ image: e.target.result, notes: '' });
      saveData(type, data);
      renderGallery(type);
    };

    reader.readAsDataURL(file);
  });
}

handleUpload('euUpload', 'eu');
handleUpload('usUpload', 'us');

renderGallery('eu');
renderGallery('us');
</script>

</body>
</html>
