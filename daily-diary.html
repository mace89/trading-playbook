<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZHlhdnpxcmFlandydmFjbGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njk3NDQsImV4cCI6MjA5MjU0NTc0NH0.zGUhhBt86s2bWhGz4HlCgljGKWnpHIeH7eobCdFWUTg";
const supabase = createClient(supabaseUrl, supabaseKey);

let currentDate = "";

// DATE PICKER
document.getElementById("datePicker").addEventListener("change", (e) => {
  currentDate = e.target.value;
  render();
});

// ADD TRADE
window.addEntry = async function(session) {
  const input = document.getElementById(session + "Link");
  const link = input.value.trim();

  if (!link) return alert("Paste TradingView image link");
  if (!currentDate) return alert("Select a date first");

  const { error } = await supabase.from("trades_2").insert([
    {
      date: currentDate,
      session: session,
      image_url: link,
      notes: ""
    }
  ]);

  if (error) {
    console.error(error);
    alert("Error saving trade");
    return;
  }

  input.value = "";
  render();
};

// RENDER TRADES
async function render() {
  if (!currentDate) return;

  ["eu", "us"].forEach(async (session) => {
    const container = document.getElementById(session + "Entries");
    container.innerHTML = "";

    const { data, error } = await supabase
      .from("trades_2")
      .select("*")
      .eq("date", currentDate)
      .eq("session", session)
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      return;
    }

    (data || []).forEach((trade) => {
      const div = document.createElement("div");
      div.className = "entry";

      const img = document.createElement("img");
      img.src = trade.image_url;

      const textarea = document.createElement("textarea");
      textarea.value = trade.notes || "";

      textarea.addEventListener("change", async () => {
        await supabase
          .from("trades_2")
          .update({ notes: textarea.value })
          .eq("id", trade.id);
      });

      const del = document.createElement("button");
      del.textContent = "Delete";

      del.onclick = async () => {
        await supabase
          .from("trades_2")
          .delete()
          .eq("id", trade.id);

        render();
      };

      div.appendChild(img);
      div.appendChild(textarea);
      div.appendChild(del);

      container.appendChild(div);
    });
  });
}
</script>
