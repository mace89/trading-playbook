<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Diary</title>
<style>
body {
  font-family: 'Courier New', monospace;
  background: #000;
  color: #00ff88;
  margin: 0;
  padding: 20px;
}

h1, h2 {
  text-align: center;
  text-shadow: 0 0 10px #00ff88;
}

.section {
  margin-bottom: 50px;
}

.upload-box {
  border: 1px dashed #00ff88;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
  border-radius: 8px;
  background: rgba(0,255,136,0.05);
}

input[type="file"] {
  margin-top: 10px;
  color: #00ff88;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  background: #020202;
  border: 1px solid #00ff88;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,255,136,0.2);
}

.card img {
  width: 100%;
  border-radius: 5px;
  border: 1px solid #00ff88;
}

textarea {
  width: 100%;
  margin-top: 10px;
  background: #000;
  color: #00ff88;
  border: 1px solid #00ff88;
  border-radius: 5px;
  padding: 8px;
  font-family: 'Courier New', monospace;
}

button {
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px solid #00ff88;
  background: transparent;
  color: #00ff88;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #00ff88;
  color: #000;
}

button.delete {
  border-color: #ff0033;
  color: #ff0033;
}

button.delete:hover {
  background: #ff0033;
  color: #000;
}

/* subtle matrix glow animation */
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(0,255,136,0.08) 0%, transparent 70%);
  animation: pulse 4s infinite;
}

@keyframes pulse {
  0% { opacity: 0.3; }
  50% { opacity: 0.6; }
  100% { opacity: 0.3; }
}
</style>
</head>
<body>

<h1>Daily Diary</h1>

<div class="section">
  <h2>EU Session (DAX)</h2>
  <div class="upload-box">
    <p>Upload Trade Screenshot</p>
    <input type="file" id="euUpload" accept="image/*">
  </div>
  <div id="euGallery" class="gallery"></div>
</div>

<div class="section">
  <h2>US Session</h2>
  <div class="upload-box">
    <p>Upload Trade Screenshot</p>
    <input type="file" id="usUpload" accept="image/*">
  </div>
  <div id="usGallery" class="gallery"></div>
</div>

<script>
function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function loadData(key) {
  return JSON.parse(localStorage.getItem(key)) || [];
}

function createCard(entry, index, type) {
  const card = document.createElement('div');
  card.className = 'card';

  const img = document.createElement('img');
  img.src = entry.image;

  const textarea = document.createElement('textarea');
  textarea.value = entry.notes;
  textarea.placeholder = 'Write trade notes...';

  textarea.addEventListener('change', () => {
    const data = loadData(type);
    data[index].notes = textarea.value;
    saveData(type, data);
  });

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete';
  delBtn.className = 'delete';

  delBtn.onclick = () => {
    let data = loadData(type);
    data.splice(index, 1);
    saveData(type, data);
    renderGallery(type);
  };

  card.appendChild(img);
  card.appendChild(textarea);
  card.appendChild(delBtn);

  return card;
}

function renderGallery(type) {
  const gallery = document.getElementById(type + 'Gallery');
  gallery.innerHTML = '';
  const data = loadData(type);

  data.forEach((entry, index) => {
    gallery.appendChild(createCard(entry, index, type));
  });
}

function handleUpload(inputId, type) {
  const input = document.getElementById(inputId);

  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = loadData(type);
      data.push({ image: e.target.result, notes: '' });
      saveData(type, data);
      renderGallery(type);
    };

    reader.readAsDataURL(file);
  });
}

handleUpload('euUpload', 'eu');
handleUpload('usUpload', 'us');

renderGallery('eu');
renderGallery('us');
</script>

</body>
</html>
