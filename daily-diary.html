<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Diary</title>

<style>
body {
  font-family: 'Courier New', monospace;
  background: #000;
  color: #00ff88;
  margin: 0;
  padding: 20px;
}

h1, h2 {
  text-align: center;
  text-shadow: 0 0 10px #00ff88;
}

.date-picker {
  text-align: center;
  margin-bottom: 30px;
}

input[type="date"] {
  background: #000;
  color: #00ff88;
  border: 1px solid #00ff88;
  padding: 8px;
}

.section {
  margin-bottom: 40px;
}

.input-box {
  text-align: center;
  margin-bottom: 20px;
}

input[type="text"] {
  width: 70%;
  padding: 8px;
  background: #000;
  border: 1px solid #00ff88;
  color: #00ff88;
}

button {
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px solid #00ff88;
  background: transparent;
  color: #00ff88;
  cursor: pointer;
}

button:hover {
  background: #00ff88;
  color: #000;
}

.entry {
  margin-bottom: 40px;
  border: 1px solid #00ff88;
  padding: 10px;
}

.entry img {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  border: 1px solid #00ff88;
}

textarea {
  width: 100%;
  height: 120px;
  margin-top: 10px;
  background: #000;
  color: #00ff88;
  border: 1px solid #00ff88;
  padding: 10px;
}

</style>
</head>

<body>

<h1>Daily Diary</h1>

<div class="date-picker">
  <h2>Select Date</h2>
  <input type="date" id="datePicker">
</div>

<div class="section">
  <h2>EU Session</h2>
  <div class="input-box">
    <input type="text" id="euLink" placeholder="Paste TradingView image link">
    <br>
    <button onclick="addEntry('eu')">Add Trade</button>
  </div>
  <div id="euEntries"></div>
</div>

<div class="section">
  <h2>US Session</h2>
  <div class="input-box">
    <input type="text" id="usLink" placeholder="Paste TradingView image link">
    <br>
    <button onclick="addEntry('us')">Add Trade</button>
  </div>
  <div id="usEntries"></div>
</div>

<script>
let currentDate = '';

function saveData(data) {
  localStorage.setItem('diary', JSON.stringify(data));
}

function loadData() {
  return JSON.parse(localStorage.getItem('diary')) || {};
}

function addEntry(type) {
  const input = document.getElementById(type + 'Link');
  const link = input.value.trim();

  if (!link) return alert('Paste link');
  if (!currentDate) return alert('Select a date first');

  const data = loadData();

  if (!data[currentDate]) data[currentDate] = { eu: [], us: [] };

  data[currentDate][type].push({ link: link, notes: '' });

  saveData(data);
  input.value = '';
  render();
}

function render() {
  const data = loadData();
  const day = data[currentDate] || { eu: [], us: [] };

  ['eu', 'us'].forEach(type => {
    const container = document.getElementById(type + 'Entries');
    container.innerHTML = '';

    day[type].forEach((entry, index) => {
      const div = document.createElement('div');
      div.className = 'entry';

      const img = document.createElement('img');
      img.src = entry.link;

      const textarea = document.createElement('textarea');
      textarea.value = entry.notes;

      textarea.onchange = () => {
        const data = loadData();
        data[currentDate][type][index].notes = textarea.value;
        saveData(data);
      };

      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.onclick = () => {
        const data = loadData();
        data[currentDate][type].splice(index, 1);
        saveData(data);
        render();
      };

      div.appendChild(img);
      div.appendChild(textarea);
      div.appendChild(del);
      container.appendChild(div);
    });
  });
}

document.getElementById('datePicker').addEventListener('change', function() {
  currentDate = this.value;
  render();
});

</script>

</body>
</html>
