<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Diary</title>
<style>
body {
  font-family: 'Courier New', monospace;
  background: #000;
  color: #00ff88;
  margin: 0;
  padding: 20px;
}

h1, h2 {
  text-align: center;
  text-shadow: 0 0 10px #00ff88;
}

.section {
  margin-bottom: 50px;
}

.input-box {
  border: 1px dashed #00ff88;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
  border-radius: 8px;
  background: rgba(0,255,136,0.05);
}

input[type="text"] {
  width: 80%;
  padding: 8px;
  background: #000;
  border: 1px solid #00ff88;
  color: #00ff88;
  border-radius: 5px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  background: #020202;
  border: 1px solid #00ff88;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,255,136,0.2);
}

.card iframe, .card img {
  width: 100%;
  height: 200px;
  border-radius: 5px;
  border: 1px solid #00ff88;
}

textarea {
  width: 100%;
  margin-top: 10px;
  background: #000;
  color: #00ff88;
  border: 1px solid #00ff88;
  border-radius: 5px;
  padding: 8px;
  font-family: 'Courier New', monospace;
}

button {
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px solid #00ff88;
  background: transparent;
  color: #00ff88;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #00ff88;
  color: #000;
}

button.delete {
  border-color: #ff0033;
  color: #ff0033;
}

button.delete:hover {
  background: #ff0033;
  color: #000;
}
</style>
</head>
<body>

<h1>Daily Diary</h1>

<div class="section">
  <h2>EU Session (DAX)</h2>
  <div class="input-box">
    <p>Paste TradingView Chart Link</p>
    <input type="text" id="euLink" placeholder="Paste TradingView link here">
    <br>
    <button onclick="addEntry('eu')">Add Trade</button>
  </div>
  <div id="euGallery" class="gallery"></div>
</div>

<div class="section">
  <h2>US Session</h2>
  <div class="input-box">
    <p>Paste TradingView Chart Link</p>
    <input type="text" id="usLink" placeholder="Paste TradingView link here">
    <br>
    <button onclick="addEntry('us')">Add Trade</button>
  </div>
  <div id="usGallery" class="gallery"></div>
</div>

<script>
function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function loadData(key) {
  return JSON.parse(localStorage.getItem(key)) || [];
}

function createCard(entry, index, type) {
  const card = document.createElement('div');
  card.className = 'card';

  let content;

  // Always treat as image (TradingView snapshot links)
  const content = document.createElement('img');
  content.src = entry.link;

  const textarea = document.createElement('textarea');
  textarea.value = entry.notes;
  textarea.placeholder = 'Write trade notes...';

  textarea.addEventListener('change', () => {
    const data = loadData(type);
    data[index].notes = textarea.value;
    saveData(type, data);
  });

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete';
  delBtn.className = 'delete';

  delBtn.onclick = () => {
    let data = loadData(type);
    data.splice(index, 1);
    saveData(type, data);
    renderGallery(type);
  };

  card.appendChild(content);
  card.appendChild(textarea);
  card.appendChild(delBtn);

  return card;
}

function renderGallery(type) {
  const gallery = document.getElementById(type + 'Gallery');
  gallery.innerHTML = '';
  const data = loadData(type);

  data.forEach((entry, index) => {
    gallery.appendChild(createCard(entry, index, type));
  });
}

function addEntry(type) {
  const input = document.getElementById(type + 'Link');
  const link = input.value.trim();

  if (!link) return;

  const data = loadData(type);
  data.push({ link: link, notes: '' });
  saveData(type, data);

  input.value = '';
  renderGallery(type);
}

renderGallery('eu');
renderGallery('us');
</script>

</body>
</html>
