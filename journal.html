<!DOCTYPE html>
<html>
<head>
  <title>Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#030604; color:#62ff9e; }
    .nav { padding:20px; border-bottom:1px solid rgba(98,255,158,0.2); text-align:center; }
    .nav a { margin:0 15px; text-decoration:none; color:#62ff9e; font-weight:bold; }
    h1 { text-align:center; margin-top:30px; }
    .container { max-width:1000px; margin:30px auto; padding:20px; }
    .card { border:1px solid rgba(98,255,158,0.3); padding:20px; margin-bottom:25px; }

    label {
      display:block;
      margin-top:10px;
      margin-bottom:3px;
      font-size:14px;
      opacity:0.8;
    }

    input, select, textarea {
      width:100%; padding:10px; margin:5px 0; background:#000;
      border:1px solid rgba(98,255,158,0.3); color:#62ff9e;
    }

    textarea { min-height:80px; resize:vertical; }

    button {
      margin-top:10px; padding:12px; width:100%;
      background:#62ff9e; border:none; color:#030604;
      font-weight:bold; cursor:pointer;
    }

    .danger { background:#ff4d4d; color:#fff; }
    .stats { display:flex; justify-content:space-between; flex-wrap:wrap; }
    .stat { width:30%; margin-bottom:15px; }
    ul { padding-left:20px; }
    li { margin-bottom:10px; }
    small { color:rgba(98,255,158,0.75); }
    a { color:#62ff9e; }

    #beReasonWrap { display:none; }

    #galleryOverlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.96);
      z-index:9999; padding:20px;
    }

    .gallery-top {
      display:flex; justify-content:space-between;
      align-items:center; margin-bottom:15px;
    }

    .gallery-controls {
      display:flex; gap:10px; flex-wrap:wrap;
      margin-bottom:15px;
    }

    .gallery-image-wrap {
      display:flex; align-items:center;
      justify-content:center; height:70vh;
      border:1px solid rgba(98,255,158,0.3);
      background:#000;
    }

    #galleryImage {
      max-width:100%; max-height:100%;
      object-fit:contain;
    }

    .close-btn {
      background:#ff4d4d; color:white;
      padding:10px 18px;
    }
  </style>
</head>

<body>

<div class="nav">
  <a href="index.html">HOME</a>
  <a href="playbook.html">PLAYBOOK</a>
  <a href="journal.html">JOURNAL</a>
</div>

<h1>TRADING JOURNAL</h1>

<div class="container">

<div class="card">
<h2>Add Trade</h2>

<form id="form">

<label>Date</label>
<input id="date" type="date">

<label>Entry Time</label>
<input id="entry_time" type="time">

<label>Play</label>
<select id="play" required>
<option value="" disabled selected>Select play...</option>
<option>Espresso</option>
<option>ASR</option>
<option>SR</option>
<option>Anti ASR</option>
<option>Anti SR</option>
<option>Discretion</option>
</select>

<label>Instrument</label>
<select id="market" required>
<option value="" disabled selected>Select instrument...</option>
<option>NQ</option>
<option>DAX</option>
<option>YM</option>
</select>

<label>Direction</label>
<select id="direction" required>
<option value="" disabled selected>Select direction...</option>
<option>Long</option>
<option>Short</option>
</select>

<label>Trade Quality</label>
<select id="quality" required>
<option value="" disabled selected>Select quality...</option>
<option>A+</option>
<option>Valid</option>
<option>Missing / Mistake</option>
</select>

<label>Rules Followed?</label>
<select id="rule_followed" required>
<option value="" disabled selected>Select yes or no...</option>
<option>Yes</option>
<option>No</option>
</select>

<label>Result</label>
<select id="status" required>
<option value="" disabled selected>Select result...</option>
<option>Win</option>
<option>Loss</option>
<option>BE</option>
</select>

<div id="beReasonWrap">
<label>BE Reason</label>
<select id="be_reason">
<option value="" disabled selected>Select BE reason...</option>
<option>+R reached</option>
<option>Counter setup developed</option>
<option>Major relative strength divergence developed</option>
</select>
</div>

<label>Result (R)</label>
<input id="r">

<label>PnL ($)</label>
<input id="pnl">

<label>TradingView Snapshot</label>
<input id="link">

<label>Trade Notes</label>
<textarea id="notes"></textarea>

<button type="submit">Save Trade</button>
</form>

<p id="statusMsg">Ready</p>
</div>

<div class="card">
<h2>Trades</h2>
<ul id="list"></ul>
</div>

</div>

<script>
const client = supabase.createClient(
"https://ebdyavzqraejwrvaclfg.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZHlhdnpxcmFlandydmFjbGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njk3NDQsImV4cCI6MjA5MjU0NTc0NH0.zGUhhBt86s2bWhGz4HlCgljGKWnpHIeH7eobCdFWUTg"
);

const form = document.getElementById("form");
const statusMsg = document.getElementById("statusMsg");
const statusSelect = document.getElementById("status");
const beReasonWrap = document.getElementById("beReasonWrap");

function setToday(){
document.getElementById("date").value =
new Date().toISOString().split("T")[0];
}

function toggleBE(){
beReasonWrap.style.display =
statusSelect.value==="BE" ? "block":"none";
}

statusSelect.addEventListener("change",toggleBE);

form.onsubmit = async e=>{
e.preventDefault();

await client.from("trades").insert([{
trade_date:date.value,
entry_time:entry_time.value,
play:play.value,
market:market.value,
direction:direction.value,
quality:quality.value,
rule_followed:rule_followed.value,
status:status.value,
be_reason: status.value==="BE"?be_reason.value:null,
result_r:Number(r.value||0),
pnl:Number(pnl.value||0),
image_url:link.value,
notes:notes.value
}]);

form.reset();
setToday();
toggleBE();
load();
};

async function load(){
let {data}=await client.from("trades").select("*");
list.innerHTML="";
data.forEach(t=>{
let li=document.createElement("li");
li.innerHTML=`
${t.trade_date} ${t.entry_time||""} | 
${t.play} | ${t.market} | ${t.direction} | 
Rules: ${t.rule_followed} | 
${t.status} ${t.be_reason?`(${t.be_reason})`:""} | 
$${t.pnl}
`;
list.appendChild(li);
});
}

setToday();
load();
</script>

</body>
</html>
