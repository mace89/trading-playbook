<!DOCTYPE html>
<html>
<head>
  <title>Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#030604; color:#62ff9e; }
.nav { padding:20px; border-bottom:1px solid rgba(98,255,158,0.2); text-align:center; }
.nav a { margin:0 15px; text-decoration:none; color:#62ff9e; font-weight:bold; }
h1 { text-align:center; margin-top:30px; }
.container { max-width:1000px; margin:30px auto; padding:20px; }
.card { border:1px solid rgba(98,255,158,0.3); padding:20px; margin-bottom:25px; }
label { display:block; margin-top:10px; font-size:14px; opacity:0.8; }
input, select, textarea {
  width:100%; padding:10px; margin:5px 0;
  background:#000; border:1px solid rgba(98,255,158,0.3);
  color:#62ff9e;
}
textarea { min-height:80px; }
button {
  margin-top:10px; padding:12px; width:100%;
  background:#62ff9e; border:none;
  color:#030604; font-weight:bold; cursor:pointer;
}
.danger { background:#ff4d4d; color:#fff; }
.stats { display:flex; flex-wrap:wrap; }
.stat { width:30%; margin-bottom:10px; }
#beReasonWrap { display:none; }
#galleryOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.95);
  z-index:9999; padding:20px;
}
.gallery-image-wrap {
  display:flex; justify-content:center;
  align-items:center; height:70vh;
}
#galleryImage {
  max-width:100%; max-height:100%;
}
</style>
</head>

<body>

<div class="nav">
  <a href="index.html">HOME</a>
  <a href="playbook.html">PLAYBOOK</a>
  <a href="journal.html">JOURNAL</a>
</div>

<h1>TRADING JOURNAL</h1>

<div class="container">

<div class="card">
<h2>Add Trade</h2>

<form id="form">

<label>Date</label>
<input id="date" type="date">

<label>Entry Time</label>
<input id="entry_time" type="time">

<label>Play</label>
<select id="play" required>
<option value="" disabled selected>Select...</option>
<option>Espresso</option>
<option>ASR</option>
<option>SR</option>
<option>Anti ASR</option>
<option>Anti SR</option>
<option>Discretion</option>
<option>First Bar Negative</option>
<option>First Bar Positive</option>
</select>

<label>Instrument</label>
<select id="market" required>
<option value="" disabled selected>Select...</option>
<option>NQ</option>
<option>DAX</option>
<option>YM</option>
</select>

<label>Direction</label>
<select id="direction" required>
<option value="" disabled selected>Select...</option>
<option>Long</option>
<option>Short</option>
</select>

<label>Trade Quality</label>
<select id="quality" required>
<option value="" disabled selected>Select...</option>
<option>A+</option>
<option>Valid</option>
<option>Missing / Mistake</option>
</select>

<label>Rules Followed?</label>
<select id="rule_followed" required>
<option value="" disabled selected>Select...</option>
<option>Yes</option>
<option>No</option>
</select>

<label>Result</label>
<select id="status" required>
<option value="" disabled selected>Select...</option>
<option>Win</option>
<option>Loss</option>
<option>BE</option>
</select>

<div id="beReasonWrap">
<label>BE Reason</label>
<select id="be_reason">
<option value="" disabled selected>Select...</option>
<option>+R reached</option>
<option>Counter setup developed</option>
<option>Major relative strength divergence developed</option>
</select>
</div>

<label>Result Points</label>
<input id="points">

<label>PnL ($)</label>
<input id="pnl">

<label>TradingView Snapshot</label>
<input id="link">

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit">Save Trade</button>

</form>

<p id="statusMsg">Ready</p>
</div>

<div class="card">
<h2>Stats</h2>
<div class="stats">
<div class="stat">Trades: <span id="trades">0</span></div>
<div class="stat">Winrate: <span id="winrate">0%</span></div>
<div class="stat">Total PnL: <span id="totalPnl">$0</span></div>
</div>
</div>

<div class="card">
<h2>Equity Curve</h2>
<select id="chartMode">
<option value="overall">Overall</option>
<option value="separate">Separate Plays</option>
</select>
<canvas id="equityChart"></canvas>
</div>

<div class="card">
<h2>Trade Gallery</h2>
<button id="openGalleryBtn">Open Gallery</button>
</div>

<div class="card">
<h2>Trades</h2>
<ul id="list"></ul>
</div>

<div class="card">
<h2>Danger Zone</h2>
<button class="danger" id="clearBtn">Clear All Trade Data</button>
</div>

</div>

<div id="galleryOverlay">
<button id="closeGalleryBtn">Close</button>

<div class="gallery-image-wrap">
<img id="galleryImage">
</div>

<div id="galleryInfo"></div>

<button id="prevGalleryBtn">Prev</button>
<button id="nextGalleryBtn">Next</button>
</div>

<script>
const client = supabase.createClient(
"https://ebdyavzqraejwrvaclfg.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZHlhdnpxcmFlandydmFjbGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njk3NDQsImV4cCI6MjA5MjU0NTc0NH0.zGUhhBt86s2bWhGz4HlCgljGKWnpHIeH7eobCdFWUTg"
);

const statusEl = document.getElementById("status");
const beReasonWrap = document.getElementById("beReasonWrap");

statusEl.onchange = ()=>{
  beReasonWrap.style.display = statusEl.value === "BE" ? "block" : "none";
};

form.onsubmit = async e=>{
  e.preventDefault();

  statusMsg.innerText = "Saving...";

  const statusVal = document.getElementById("status").value;

  const { error } = await client.from("trades").insert([{
    trade_date: date.value,
    entry_time: entry_time.value || null,
    play: play.value,
    market: market.value,
    direction: direction.value,
    quality: quality.value,
    rule_followed: rule_followed.value,
    status: statusVal,
    be_reason: statusVal === "BE" ? be_reason.value : null,
    result_r: Number(points.value || 0),
    pnl: Number(pnl.value || 0),
    image_url: link.value,
    notes: notes.value
  }]);

  if(error){
    statusMsg.innerText = "Error: " + error.message;
    return;
  }

  statusMsg.innerText = "Trade saved";
  form.reset();
  setToday();
  beReasonWrap.style.display = "none";
  load();
};

function setToday(){
  date.value = new Date().toISOString().split("T")[0];
}

async function load(){
  const { data } = await client.from("trades").select("*");
  trades.innerText = data.length;
}

setToday();
load();
</script>

</body>
</html>
