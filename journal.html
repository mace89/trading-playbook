<!DOCTYPE html>
<html>
<head>
  <title>Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#030604; color:#62ff9e; }
.nav { padding:20px; border-bottom:1px solid rgba(98,255,158,0.2); text-align:center; }
.nav a { margin:0 15px; text-decoration:none; color:#62ff9e; font-weight:bold; }
h1 { text-align:center; margin-top:30px; }
.container { max-width:1000px; margin:30px auto; padding:20px; }
.card { border:1px solid rgba(98,255,158,0.3); padding:20px; margin-bottom:25px; }
label { display:block; margin-top:10px; font-size:14px; opacity:0.8; }
input, select, textarea { width:100%; padding:10px; margin:5px 0; background:#000; border:1px solid rgba(98,255,158,0.3); color:#62ff9e; }
textarea { min-height:80px; }
button { margin-top:10px; padding:12px; width:100%; background:#62ff9e; border:none; color:#030604; font-weight:bold; cursor:pointer; }
.danger { background:#ff4d4d; color:#fff; }
.stats { display:flex; flex-wrap:wrap; }
.stat { width:30%; margin-bottom:10px; }
#beReasonWrap { display:none; }
#galleryOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:9999; padding:20px; }
.gallery-image-wrap { display:flex; justify-content:center; align-items:center; height:70vh; }
#galleryImage { max-width:100%; max-height:100%; }
</style>
</head>

<body>

<div class="nav">
  <a href="index.html">HOME</a>
  <a href="playbook.html">PLAYBOOK</a>
  <a href="journal.html">JOURNAL</a>
</div>

<h1>TRADING JOURNAL</h1>

<div class="container">

<div class="card">
<h2>Add Trade</h2>

<form id="form">

<label>Date</label>
<input id="date" type="date">

<label>Entry Time</label>
<input id="entry_time" type="time">

<label>Play</label>
<select id="play" required>
<option value="" disabled selected>Select...</option>
<option>Espresso</option>
<option>ASR</option>
<option>SR</option>
<option>Anti ASR</option>
<option>Anti SR</option>
<option>Discretion</option>
<option>First Bar Negative</option>
<option>First Bar Positive</option>
</select>

<label>Instrument</label>
<select id="market" required>
<option value="" disabled selected>Select...</option>
<option>NQ</option>
<option>DAX</option>
<option>YM</option>
</select>

<label>Direction</label>
<select id="direction" required>
<option value="" disabled selected>Select...</option>
<option>Long</option>
<option>Short</option>
</select>

<label>Trade Quality</label>
<select id="quality" required>
<option value="" disabled selected>Select...</option>
<option>A+</option>
<option>Valid</option>
<option>Missing / Mistake</option>
</select>

<label>Rules Followed?</label>
<select id="rule_followed" required>
<option value="" disabled selected>Select...</option>
<option>Yes</option>
<option>No</option>
</select>

<label>Result</label>
<select id="status" required>
<option value="" disabled selected>Select...</option>
<option>Win</option>
<option>Loss</option>
<option>BE</option>
</select>

<div id="beReasonWrap">
<label>BE Reason</label>
<select id="be_reason">
<option value="" disabled selected>Select...</option>
<option>+R reached</option>
<option>Counter setup developed</option>
<option>Major relative strength divergence developed</option>
</select>
</div>

<label>Result Points</label>
<input id="points">

<label>PnL ($)</label>
<input id="pnl">

<label>TradingView Snapshot</label>
<input id="link">

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit">Save Trade</button>

</form>

<p id="statusMsg">Ready</p>
</div>

<div class="card">
<h2>Stats</h2>
<div class="stats">
<div class="stat">Trades: <span id="trades">0</span></div>
<div class="stat">Winrate: <span id="winrate">0%</span></div>
<div class="stat">Total PnL: <span id="totalPnl">$0</span></div>
</div>
</div>

<div class="card">
<h2>Equity Curve</h2>
<select id="chartMode">
<option value="overall">Overall</option>
<option value="separate">Separate Plays</option>
</select>
<canvas id="equityChart"></canvas>
</div>

<div class="card">
<h2>Trade Gallery</h2>
<button id="openGalleryBtn">Open Gallery</button>
</div>

<div class="card">
<h2>Trades</h2>
<ul id="list"></ul>
</div>

<div class="card">
<h2>Danger Zone</h2>
<button class="danger" id="clearBtn">Clear All Trade Data</button>
</div>

</div>

<div id="galleryOverlay">
<button id="closeGalleryBtn">Close</button>

<div class="gallery-image-wrap">
<img id="galleryImage">
</div>

<div id="galleryInfo"></div>

<button id="prevGalleryBtn">Prev</button>
<button id="nextGalleryBtn">Next</button>
</div>

<script>
const client = supabase.createClient(
"https://ebdyavzqraejwrvaclfg.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZHlhdnpxcmFlandydmFjbGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njk3NDQsImV4cCI6MjA5MjU0NTc0NH0.zGUhhBt86s2bWhGz4HlCgljGKWnpHIeH7eobCdFWUTg"
);

let tradesData = [];
let equityChart = null;
let index = 0;

function setToday(){
  date.value = new Date().toISOString().split("T")[0];
}

status.onchange = ()=>{
  beReasonWrap.style.display = status.value === "BE" ? "block" : "none";
};

form.onsubmit = async e=>{
  e.preventDefault();

  statusMsg.innerText = "Saving...";

  const { error } = await client.from("trades").insert([{
    trade_date: date.value,
    entry_time: entry_time.value || null,
    play: play.value,
    market: market.value,
    direction: direction.value,
    quality: quality.value,
    rule_followed: rule_followed.value,
    status: status.value,
    be_reason: status.value === "BE" ? be_reason.value : null,
    result_r: Number(points.value || 0),
    pnl: Number(pnl.value || 0),
    image_url: link.value,
    notes: notes.value
  }]);

  if(error){
    statusMsg.innerText = "Error: " + error.message;
    return;
  }

  statusMsg.innerText = "Trade saved";
  form.reset();
  setToday();
  beReasonWrap.style.display = "none";
  load();
};

clearBtn.onclick = async ()=>{
  if(!confirm("Delete all trades?")) return;

  const { error } = await client.from("trades").delete().neq("id", 0);

  if(error){
    alert("Error: " + error.message);
    return;
  }

  load();
};

chartMode.onchange = draw;

openGalleryBtn.onclick = ()=>{
  galleryOverlay.style.display = "block";
  index = 0;
  showGallery();
};

closeGalleryBtn.onclick = ()=>galleryOverlay.style.display = "none";

prevGalleryBtn.onclick = ()=>{
  if(!tradesData.length) return;
  index = (index - 1 + tradesData.length) % tradesData.length;
  showGallery();
};

nextGalleryBtn.onclick = ()=>{
  if(!tradesData.length) return;
  index = (index + 1) % tradesData.length;
  showGallery();
};

function showGallery(){
  let withImages = tradesData.filter(t => t.image_url);
  let t = withImages[index];

  if(!t){
    galleryImage.src = "";
    galleryInfo.innerHTML = "No chart images found.";
    return;
  }

  galleryImage.src = t.image_url;
  galleryInfo.innerHTML = `${t.play} | ${t.market} | ${t.status} | ${Number(t.result_r || 0)} pts | $${Number(t.pnl || 0).toFixed(2)}`;
}

function draw(){
  if(equityChart) equityChart.destroy();

  let sorted = [...tradesData].sort((a,b)=>new Date(a.trade_date) - new Date(b.trade_date));
  let labels = [];

  if(chartMode.value === "overall"){
    let data = [];
    let eq = 0;

    sorted.forEach(t=>{
      eq += Number(t.result_r || 0);
      labels.push(t.trade_date);
      data.push(eq);
    });

    equityChart = new Chart(equityChartCtx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Equity Points",
          data,
          borderColor: "#62ff9e"
        }]
      }
    });

  } else {
    let playTotals = {};
    let datasetsMap = {};

    const plays = ["Espresso","ASR","SR","Anti ASR","Anti SR","Discretion","First Bar Negative","First Bar Positive"];

    plays.forEach(p=>{
      playTotals[p] = 0;
      datasetsMap[p] = [];
    });

    sorted.forEach(t=>{
      labels.push(t.trade_date);

      plays.forEach(p=>{
        if(t.play === p){
          playTotals[p] += Number(t.result_r || 0);
        }
        datasetsMap[p].push(playTotals[p]);
      });
    });

    equityChart = new Chart(equityChartCtx, {
      type: "line",
      data: {
        labels,
        datasets: plays.map(p=>({
          label: p,
          data: datasetsMap[p],
          borderColor: p === "Espresso" ? "#62ff9e" : "#ffffff",
          tension: 0.2
        }))
      }
    });
  }
}

async function load(){
  const { data, error } = await client
    .from("trades")
    .select("*")
    .order("trade_date", { ascending: true });

  if(error){
    statusMsg.innerText = "Error loading trades: " + error.message;
    return;
  }

  tradesData = data || [];
  list.innerHTML = "";

  let total = tradesData.length;
  let wins = tradesData.filter(t=>Number(t.pnl || 0) > 0);
  let totalPnlValue = tradesData.reduce((a,b)=>a + Number(b.pnl || 0), 0);

  trades.innerText = total;
  winrate.innerText = (total ? (wins.length / total * 100).toFixed(1) : 0) + "%";
  totalPnl.innerText = "$" + totalPnlValue.toFixed(2);

  tradesData.forEach(t=>{
    let li = document.createElement("li");
    li.innerHTML = `${t.trade_date} | ${t.play} | ${t.market} | ${t.direction} | ${Number(t.result_r || 0)} pts | $${Number(t.pnl || 0).toFixed(2)}`;
    list.appendChild(li);
  });

  draw();
}

const equityChartCtx = document.getElementById("equityChart");

setToday();
load();
</script>

</body>
</html>
