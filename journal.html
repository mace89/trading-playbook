<!DOCTYPE html>
<html>
<head>
  <title>Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#030604; color:#62ff9e; }
.nav { padding:20px; border-bottom:1px solid rgba(98,255,158,0.2); text-align:center; }
.nav a { margin:0 15px; text-decoration:none; color:#62ff9e; font-weight:bold; }
h1 { text-align:center; margin-top:30px; }
.container { max-width:1000px; margin:30px auto; padding:20px; }
.card { border:1px solid rgba(98,255,158,0.3); padding:20px; margin-bottom:25px; }
label { display:block; margin-top:10px; font-size:14px; opacity:0.8; }
input, select, textarea {
  width:100%; padding:10px; margin:5px 0;
  background:#000; border:1px solid rgba(98,255,158,0.3);
  color:#62ff9e;
}
textarea { min-height:80px; }
button {
  margin-top:10px; padding:12px; width:100%;
  background:#62ff9e; border:none;
  color:#030604; font-weight:bold; cursor:pointer;
}
.danger { background:#ff4d4d; color:#fff; }
.stats { display:flex; flex-wrap:wrap; }
.stat { width:30%; margin-bottom:10px; }
#beReasonWrap { display:none; }
#galleryOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.95);
  z-index:9999; padding:20px;
}
.gallery-image-wrap {
  display:flex; justify-content:center;
  align-items:center; height:70vh;
}
#galleryImage { max-width:100%; max-height:100%; }
</style>
</head>

<body>

<div class="nav">
  <a href="index.html">HOME</a>
  <a href="journal.html">JOURNAL</a>
  <a href="playbook.html">PLAYBOOK</a>
  <a href="mindset.html">MINDSET</a>
  <a href="mindset.html">control-panel</a>
</div>

<h1>TRADING JOURNAL</h1>

<div class="container">

<div class="card">
<h2>Add Trade</h2>

<form id="form">

<label>Date</label>
<input id="date" type="date">

<label>Entry Time</label>
<input id="entry_time" type="time">

<label>Play</label>
<select id="play" required>
<option value="" disabled selected>Select...</option>
<option>Espresso</option>
<option>ASR</option>
<option>SR</option>
<option>Anti ASR</option>
<option>Anti SR</option>
<option>Discretion</option>
<option>First Bar Negative</option>
<option>First Bar Positive</option>
</select>

<label>Instrument</label>
<select id="market" required>
<option value="" disabled selected>Select...</option>
<option>NQ</option>
<option>DAX</option>
<option>YM</option>
</select>

<label>Direction</label>
<select id="direction" required>
<option value="" disabled selected>Select...</option>
<option>Long</option>
<option>Short</option>
</select>

<label>Trade Quality</label>
<select id="quality" required>
<option value="" disabled selected>Select...</option>
<option>A+</option>
<option>Valid</option>
<option>Missing / Mistake</option>
</select>

<label>Rules Followed?</label>
<select id="rule_followed" required>
<option value="" disabled selected>Select...</option>
<option>Yes</option>
<option>No</option>
</select>

<label>Result</label>
<select id="status" required>
<option value="" disabled selected>Select...</option>
<option>Win</option>
<option>Loss</option>
<option>BE</option>
</select>

<div id="beReasonWrap">
<label>BE Reason</label>
<select id="be_reason">
<option value="" disabled selected>Select...</option>
<option>+R reached</option>
<option>Counter setup developed</option>
<option>Major relative strength divergence developed</option>
</select>
</div>

<label>Result Points</label>
<input id="points">

<label>PnL ($)</label>
<input id="pnl">

<label>TradingView Snapshot</label>
<input id="link">

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit">Save Trade</button>

</form>

<p id="statusMsg">Ready</p>
</div>

<div class="card">
<h2>Stats</h2>

<label>Stats By Play</label>
<select id="statsPlay">
<option value="All">All Plays</option>
<option>Espresso</option>
<option>ASR</option>
<option>SR</option>
<option>Anti ASR</option>
<option>Anti SR</option>
<option>Discretion</option>
<option>First Bar Negative</option>
<option>First Bar Positive</option>
</select>

<div class="stats">
<div class="stat">Trades: <span id="trades">0</span></div>
<div class="stat">Winrate: <span id="winrate">0%</span></div>
<div class="stat">Total Points: <span id="totalPoints">0</span></div>
<div class="stat">Total PnL: <span id="totalPnl">$0</span></div>
<div class="stat">Profit Factor: <span id="profitFactor">0</span></div>
<div class="stat">Max Drawdown: <span id="maxDrawdown">$0</span></div>
<div class="stat">Expectancy: <span id="expectancy">$0</span></div>
</div>
</div>

<div class="card">
<h2>Equity Curve</h2>
<select id="chartMode">
<option value="overall">Overall</option>
<option value="separate">Separate Plays</option>
</select>
<canvas id="equityChart"></canvas>
</div>

<div class="card">
<h2>Trade Gallery</h2>
<button id="openGalleryBtn">Open Gallery</button>
</div>

<div class="card">
<h2>Trades</h2>
<ul id="list"></ul>
</div>

<div class="card">
<h2>Danger Zone</h2>
<button class="danger" id="clearBtn">Clear All Trade Data</button>
</div>

</div>

<div id="galleryOverlay">
<button id="closeGalleryBtn">Close</button>

<div class="gallery-image-wrap">
<img id="galleryImage">
</div>

<div id="galleryInfo"></div>

<button id="prevGalleryBtn">Prev</button>
<button id="nextGalleryBtn">Next</button>
</div>

<script>
const SUPABASE_URL = "https://ebdyavzqraejwrvaclfg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZHlhdnpxcmFlandydmFjbGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njk3NDQsImV4cCI6MjA5MjU0NTc0NH0.zGUhhBt86s2bWhGz4HlCgljGKWnpHIeH7eobCdFWUTg";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let tradesData = [];
let equityChart = null;
let index = 0;

const statusEl = document.getElementById("status");
const beReasonWrap = document.getElementById("beReasonWrap");
const equityChartCtx = document.getElementById("equityChart");
const statsPlay = document.getElementById("statsPlay");

function setToday(){
  document.getElementById("date").value = new Date().toISOString().split("T")[0];
}

statusEl.onchange = ()=>{
  beReasonWrap.style.display = statusEl.value === "BE" ? "block" : "none";
};

statsPlay.onchange = updateStats;

form.onsubmit = async e=>{
  e.preventDefault();

  statusMsg.innerText = "Saving...";

  const statusVal = document.getElementById("status").value;

  const { error } = await client.from("trades").insert([{
    trade_date: date.value,
    entry_time: entry_time.value || null,
    play: play.value,
    market: market.value,
    direction: direction.value,
    quality: quality.value,
    rule_followed: rule_followed.value,
    status: statusVal,
    be_reason: statusVal === "BE" ? be_reason.value : null,
    result_r: Number(points.value || 0),
    pnl: Number(pnl.value || 0),
    image_url: link.value,
    notes: notes.value
  }]);

  if(error){
    statusMsg.innerText = "Error: " + error.message;
    return;
  }

  statusMsg.innerText = "Trade saved";
  form.reset();
  setToday();
  beReasonWrap.style.display = "none";
  load();
};

clearBtn.onclick = async ()=>{
  if(!confirm("Delete all trades?")) return;

  const { error } = await client.from("trades").delete().neq("id", 0);

  if(error){
    alert("Error: " + error.message);
    return;
  }

  load();
};

chartMode.onchange = draw;

openGalleryBtn.onclick = ()=>{
  galleryOverlay.style.display = "block";
  index = 0;
  showGallery();
};

closeGalleryBtn.onclick = ()=>galleryOverlay.style.display = "none";

prevGalleryBtn.onclick = ()=>{
  const withImages = tradesData.filter(t => t.image_url);
  if(!withImages.length) return;
  index = (index - 1 + withImages.length) % withImages.length;
  showGallery();
};

nextGalleryBtn.onclick = ()=>{
  const withImages = tradesData.filter(t => t.image_url);
  if(!withImages.length) return;
  index = (index + 1) % withImages.length;
  showGallery();
};

function showGallery(){
  const withImages = tradesData.filter(t => t.image_url);
  let t = withImages[index];

  if(!t){
    galleryImage.src = "";
    galleryInfo.innerHTML = "No chart images found.";
    return;
  }

  galleryImage.src = t.image_url;
  galleryInfo.innerHTML = `
    ${t.trade_date} | ${t.play} | ${t.market} | ${t.direction || ""} | ${t.status} | ${Number(t.result_r || 0)} pts | $${Number(t.pnl || 0).toFixed(2)}
    ${t.notes ? `<br>Notes: ${t.notes}` : ""}
  `;
}

function getStatsData(){
  if(statsPlay.value === "All"){
    return tradesData;
  }

  return tradesData.filter(t => t.play === statsPlay.value);
}

function updateStats(){
  const statsData = getStatsData();

  let total = statsData.length;
  let wins = statsData.filter(t => Number(t.pnl || 0) > 0);
  let totalPnlValue = statsData.reduce((a,b)=>a + Number(b.pnl || 0), 0);
  let totalPtsValue = statsData.reduce((a,b)=>a + Number(b.result_r || 0), 0);

  let grossProfit = statsData
    .filter(t => Number(t.pnl || 0) > 0)
    .reduce((a,b)=>a + Number(b.pnl || 0), 0);

  let grossLoss = Math.abs(
    statsData
      .filter(t => Number(t.pnl || 0) < 0)
      .reduce((a,b)=>a + Number(b.pnl || 0), 0)
  );

  let pf = grossLoss ? grossProfit / grossLoss : (grossProfit > 0 ? Infinity : 0);
  let expectancyValue = total ? totalPnlValue / total : 0;

  let equity = 0;
  let peak = 0;
  let maxDD = 0;

  statsData.forEach(t=>{
    equity += Number(t.pnl || 0);
    if(equity > peak) peak = equity;
    let dd = peak - equity;
    if(dd > maxDD) maxDD = dd;
  });

  trades.innerText = total;
  winrate.innerText = (total ? (wins.length / total * 100).toFixed(1) : 0) + "%";
  totalPoints.innerText = totalPtsValue.toFixed(2);
  totalPnl.innerText = "$" + totalPnlValue.toFixed(2);
  profitFactor.innerText = pf === Infinity ? "∞" : pf.toFixed(2);
  maxDrawdown.innerText = "$" + maxDD.toFixed(2);
  expectancy.innerText = "$" + expectancyValue.toFixed(2);
}

function updateList(){
  list.innerHTML = "";

  tradesData.forEach(t=>{
    let li = document.createElement("li");
    li.innerHTML = `
      ${t.trade_date} ${t.entry_time || ""} | ${t.play} | ${t.market} | ${t.direction || ""} | ${t.status} ${t.be_reason ? `(${t.be_reason})` : ""} | Rules: ${t.rule_followed || ""} | ${Number(t.result_r || 0)} pts | $${Number(t.pnl || 0).toFixed(2)}
      ${t.notes ? `<br><small>Notes: ${t.notes}</small>` : ""}
    `;
    list.appendChild(li);
  });
}

function draw(){
  if(equityChart) equityChart.destroy();

  let sorted = [...tradesData].sort((a,b)=>{
    const da = new Date(`${a.trade_date}T${a.entry_time || "00:00"}`);
    const db = new Date(`${b.trade_date}T${b.entry_time || "00:00"}`);
    return da - db;
  });

  let labels = [];

  if(chartMode.value === "overall"){
    let data = [];
    let eq = 0;

    sorted.forEach(t=>{
      eq += Number(t.result_r || 0);
      labels.push(`${t.trade_date} ${t.entry_time || ""}`);
      data.push(eq);
    });

    equityChart = new Chart(equityChartCtx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Overall Equity Points",
          data,
          borderColor: "#62ff9e",
          backgroundColor: "rgba(98,255,158,0.15)",
          tension: 0.25
        }]
      },
      options: {
        plugins: { legend: { labels: { color: "#62ff9e" } } },
        scales: {
          x: { ticks: { color:"#62ff9e" }, grid:{ color:"rgba(98,255,158,0.1)" } },
          y: { ticks: { color:"#62ff9e" }, grid:{ color:"rgba(98,255,158,0.1)" } }
        }
      }
    });

  } else {
    const plays = ["Espresso","ASR","SR","Anti ASR","Anti SR","Discretion","First Bar Negative","First Bar Positive"];
    let totals = {};
    let datasetsMap = {};

    plays.forEach(p=>{
      totals[p] = 0;
      datasetsMap[p] = [];
    });

    sorted.forEach(t=>{
      labels.push(`${t.trade_date} ${t.entry_time || ""}`);

      plays.forEach(p=>{
        if(t.play === p){
          totals[p] += Number(t.result_r || 0);
        }
        datasetsMap[p].push(totals[p]);
      });
    });

    equityChart = new Chart(equityChartCtx, {
      type: "line",
      data: {
        labels,
        datasets: plays.map((p, i)=>({
          label: p,
          data: datasetsMap[p],
          borderColor: i === 0 ? "#62ff9e" : "#ffffff",
          tension: 0.25
        }))
      },
      options: {
        plugins: { legend: { labels: { color: "#62ff9e" } } },
        scales: {
          x: { ticks: { color:"#62ff9e" }, grid:{ color:"rgba(98,255,158,0.1)" } },
          y: { ticks: { color:"#62ff9e" }, grid:{ color:"rgba(98,255,158,0.1)" } }
        }
      }
    });
  }
}

async function load(){
  const { data, error } = await client
    .from("trades")
    .select("*")
    .order("trade_date", { ascending: true })
    .order("entry_time", { ascending: true });

  if(error){
    statusMsg.innerText = "Error loading trades: " + error.message;
    return;
  }

  tradesData = data || [];
  updateStats();
  updateList();
  draw();
}

setToday();
load();
</script>

</body>
</html>
