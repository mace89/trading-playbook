<section id="anti-spiral" style="background-color:#000; color:#00ff88; padding:20px; font-family:Arial, sans-serif; border:1px solid #00ff88; margin-top:20px;">

  <h2 style="text-align:center;">⚠️ ANTI-SPIRAL CONTROL PANEL</h2>

  <p style="text-align:center; color:#fff;">
    You are not here to make money.<br>
    You are here to execute correctly.
  </p>

  <hr style="border:1px solid #00ff88;">

  <!-- ✅ CHECKBOX GATE -->
  <h3>✅ PRE-TRADE CHECK (ALL MUST BE TRUE)</h3>
  <div id="checklist">
    <label><input type="checkbox"> This is my exact setup</label><br>
    <label><input type="checkbox"> I am calm (no urgency)</label><br>
    <label><input type="checkbox"> I am not trying to make money back</label><br>
    <label><input type="checkbox"> Risk is fixed (no size increase)</label><br>
  </div>

  <br>
  <button onclick="checkTrade()" style="background:#00ff88; border:none; padding:10px; cursor:pointer;">
    Confirm Trade
  </button>

  <p id="check-result" style="color:#ff4444; font-weight:bold;"></p>

  <hr style="border:1px solid #00ff88;">

  <!-- ⏱ TIMER -->
  <h3>⏱ 10 MINUTE LOCKOUT</h3>
  <button onclick="startTimer()" style="background:#00ff88; border:none; padding:10px; cursor:pointer;">
    Start Lockout
  </button>

  <p id="timer" style="font-size:20px; color:#fff;">10:00</p>

  <hr style="border:1px solid #00ff88;">

  <!-- 🚫 STOP BUTTON -->
  <h3>🚫 EMERGENCY STOP</h3>
  <button onclick="triggerStop()" style="background:#ff4444; color:#fff; border:none; padding:12px; font-size:16px; cursor:pointer;">
    I BROKE A RULE → STOP TRADING
  </button>

</section>

<!-- 🚫 FULL SCREEN OVERLAY -->
<div id="overlay" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:#ff4444;
  font-size:40px;
  text-align:center;
  padding-top:20%;
  z-index:9999;
">
  🚫 STOP TRADING 🚫<br><br>
  You broke your rules.<br>
  Close your platform now.
</div>

<script>
  function checkTrade() {
    const checkboxes = document.querySelectorAll('#checklist input');
    let allChecked = true;

    checkboxes.forEach(box => {
      if (!box.checked) allChecked = false;
    });

    const result = document.getElementById("check-result");

    if (allChecked) {
      result.style.color = "#00ff88";
      result.innerText = "✔ Trade allowed (follow your rules)";
    } else {
      result.style.color = "#ff4444";
      result.innerText = "❌ Trade NOT allowed";
    }
  }

  let time = 600;
  let timerInterval;

  function startTimer() {
    clearInterval(timerInterval);
    time = 600;

    timerInterval = setInterval(() => {
      let minutes = Math.floor(time / 60);
      let seconds = time % 60;

      document.getElementById("timer").innerText =
        `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

      if (time <= 0) {
        clearInterval(timerInterval);
        document.getElementById("timer").innerText = "✔ You may trade";
      }

      time--;
    }, 1000);
  }

  function triggerStop() {
    document.getElementById("overlay").style.display = "block";
  }
</script>
